# External Secrets Operator reads the customer-service credentials from Secrets Manager
# (auto-repair-shop-prd/customer) and materialises them into the k8s Secret
# `customer-service-secrets` that the Deployment / migrate Job consume.
# Only effective with IRSA; kept for parity with the other overlays.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No serviceAccountRef: uses the External Secrets controller's IRSA role.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: customer-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: customer-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: auto-repair-shop-prd/customer
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: auto-repair-shop-prd/customer
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: auto-repair-shop-prd/customer
        property: POSTGRES_DB
    - secretKey: JWT_SECRET
      remoteRef:
        key: auto-repair-shop-prd/customer
        property: JWT_SECRET
    - secretKey: INTERNAL_TOKEN
      remoteRef:
        key: auto-repair-shop-prd/customer
        property: INTERNAL_TOKEN
