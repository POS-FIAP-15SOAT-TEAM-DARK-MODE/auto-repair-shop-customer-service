apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# Restricted-account (AWS Academy Learner Lab) overlay. No ALB Ingress and no
# External Secrets: IRSA is unavailable there. The Secret customer-service-secrets is
# created by the pipeline from Secrets Manager. The service is ClusterIP and is
# reached from inside the cluster (or via `kubectl port-forward`).
resources:
  - ../../base

components:
  - ../../components/observability

patches:
  - path: patch-configmap.yaml
    target:
      kind: ConfigMap
      name: customer-service-config
