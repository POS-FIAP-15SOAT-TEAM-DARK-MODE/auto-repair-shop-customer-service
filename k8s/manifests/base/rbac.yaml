apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-service
---
# Grants only what the Deployment's wait-for-migrations initContainer needs:
# read the customer-service-db-migrate Job's status. Nothing else in the service
# talks to the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: customer-service-wait-migrations
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: customer-service-wait-migrations
subjects:
  - kind: ServiceAccount
    name: customer-service
roleRef:
  kind: Role
  name: customer-service-wait-migrations
  apiGroup: rbac.authorization.k8s.io
