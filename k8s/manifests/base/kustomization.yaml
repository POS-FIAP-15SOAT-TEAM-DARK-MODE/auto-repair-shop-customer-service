apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared namespace of the whole system; every object is prefixed with the service name.
namespace: auto-repair-shop

# The customer-service workload only. Networking is owned by Terraform in
# auto-repair-shop-infra-k8s; the database (RDS) by auto-repair-shop-infra-db.
resources:
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - migrate-job.yaml

images:
  - name: auto-repair-shop-customer-service
    newTag: dev
