apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-service-config
  labels:
    app: customer-service
# Non-sensitive runtime config (mirrors .env). Sensitive values live in the
# customer-service-secrets Secret. POSTGRES_HOST points at the in-cluster
# Postgres by default and is overridden to the RDS endpoint in the lab/stg/prd overlays.
data:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "customer"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  JWT_EXPIRES_IN: "24h"
  BCRYPT_COST: "12"
  LOG_LEVEL: "INFO"
  PORT: "8081"
  POSTGRES_SSLMODE: "disable"
  SEED_ENABLED: "false"
